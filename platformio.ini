[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_filters = send_on_enter, colorize

lib_deps =
    adafruit/Adafruit INA219
    mikalhart/TinyGPSPlus
    adafruit/Adafruit BMP5xx Library
    adafruit/Adafruit BNO08x

build_flags =
    -DUSB_DUAL_SERIAL
    -DLAYOUT_US_ENGLISH
